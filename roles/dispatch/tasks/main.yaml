# Task:1 installing golang  module
  - name: installing golang module
    ansible.builtin.package:
      name: 
        - golang
        - unzip
      state: present
      
# Task:2 app setup
  - name: app setup
    ansible.builtin.import_role:
      name: common
      tasks_from: app-setup.yaml
    tags:
    - deployment      

# Task:6 Lets download the dependencies.
  - name: Download dependencies and build the application
    ansible.builtin.command: "{{ item }}"
    args:
      chdir: /app
    loop:
      - go mod init dispatch
      - go get
      - go build

  - name: system setup
    ansible.builtin.import_role:
      name: common
      tasks_from: system-setup.yaml
    tags:
    - deployment
