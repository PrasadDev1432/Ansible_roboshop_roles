
# Task:-5 Create roboshop system user if not exists, skip if exists
  - name: Task 1 - Create roboshop system user if not exists, skip if exists
    ansible.builtin.user:
      name: roboshop
      comment: "roboshop system user"
      system: yes
      home: /app
      shell: /sbin/nologin
      state: present

# Task:-6 removing existing app directory
  - name: removing existing app directory
    ansible.builtin.file:
      path: /app
      state: absent

# Task:-7 Creating app directory
  - name: Creating app directory
    ansible.builtin.file:
      path: /app
      state: directory


# Task:-8 removing existing code {{ component }} files
  - name: removing existing code {{ component }} files
    ansible.builtin.file:
      path: /tmp/{{ component }}.zip
      state: absent

# Task:-9 Download the application code to created app directory.
  - name: Download the application code to created app directory.
    ansible.builtin.get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
      dest: /tmp/{{ component }}.zip

  - name: install unzip
    ansible.builtin.dnf:
      name: unzip
      state: present

# Task:- 10 Unzip the downloaded files
  - name: Unzip the downloaded {{ component }} files
    ansible.builtin.unarchive:
      src: /tmp/{{ component }}.zip
      dest: /app
      remote_src: yes